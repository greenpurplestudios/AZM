<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" aria-label="شعار عزم">
  <defs>
    <linearGradient id="crest-hl-day" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4EF3DE" />
      <stop offset="100%" stopColor="#00D7BD" />
    </linearGradient>
    <linearGradient id="crest-sh-day" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D7BD" />
      <stop offset="100%" stopColor="#009A85" />
    </linearGradient>
    <linearGradient id="crest-deep-day" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#009A85" />
      <stop offset="100%" stopColor="#006B5D" />
    </linearGradient>
    <linearGradient id="face-sh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>
    <linearGradient id="beak-hl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8E95A5" />
      <stop offset="50%" stopColor="#3A3D47" />
      <stop offset="100%" stopColor="#18191E" />
    </linearGradient>
    <filter id="eye-glow-day" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

